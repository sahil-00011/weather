<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
        />
        <title>Weather App</title>
        <link rel="stylesheet" href="style.css" />
    </head>        
        
    <body>
        <div class="background-layer bg-layer-1"></div>
        <div class="background-layer bg-layer-2"></div>

        <div class="weather-app">
            <form class="search-form" action="">
                <input
                    class="city-input"
                    type="text"
                    placeholder="Enter city name"
                />
                <button class="search-btn" type="submit">
                    <i class="material-icons">search</i>
                </button>
            </form>
            <div class="city-date-section">
                <h2 class="city">asansol</h2>
                <p class="date">7 jun 2024</p>
            </div>
            <div class="temperature-info">
                <div class="description">
                    <i class="material-icons">sunny</i>
                    <span class="description-text">Sunny</span> 
                </div>
                <div class="temp">30&#176;</div>
            </div>
            <div class="additional-info">
                <div class="wind-info">
                    <i class="material-icons">air</i>
                    <div>
                        <h3 class="wind-speed">4 KM/H</h3>
                        <p class="wind-label">Wind</p>
                    </div>
                </div>
                <div class="humidity-info">
                    <i class="material-icons">water_drop</i>
                    <div>
                        <h3 class="humidity">45%</h3>
                        <p class="humidity-label">humidity</p>
                    </div>
                </div>
                <div class="visibility-info">
                    <i class="material-icons">visibility</i>
                    <div>
                        <h3 class="visibility-distance">4 km</h3>
                        <p class="visibility-label">Visibility</p>
                    </div>
                </div>
            </div>
            <section class="forecast-section">
                <div class="forecast-header">
                    <h3>3-Day Forecast</h3>
                    <p class="forecast-subtitle">Predicted weather for the next few days</p>
                </div>
                <div class="forecast-cards">
                    <div class="forecast-card day-1">
                        <p class="forecast-day">Day 1</p>
                        <i class="material-icons forecast-icon">wb_sunny</i>
                        <p class="forecast-desc">Clear</p>
                        <p class="forecast-temp">24°C / 18°C</p>
                    </div>
                    <div class="forecast-card day-2">
                        <p class="forecast-day">Day 2</p>
                        <i class="material-icons forecast-icon">cloud</i>
                        <p class="forecast-desc">Cloudy</p>
                        <p class="forecast-temp">22°C / 17°C</p>
                    </div>
                    <div class="forecast-card day-3">
                        <p class="forecast-day">Day 3</p>
                        <i class="material-icons forecast-icon">grain</i>
                        <p class="forecast-desc">Rain</p>
                        <p class="forecast-temp">20°C / 16°C</p>
                    </div>
                </div>
            </section>
        </div>

        <script src="script.js"></script>
    </body>
</html>
